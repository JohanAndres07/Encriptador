<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="/assets/Logo.svg" type="image/svg+xml">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="app.css">
    <title>Encriptador Alura</title>
</head>

<body>
  <header class="logo">
    <img src="/assets/Logo.svg" alt="">
  </header>
  <main>
    <section>
        <div class="container">
            <div class="container-encriptar">
                <textarea name="" id="" placeholder="Ingrese el texto aqui"></textarea>
            </div>
            <p>
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 20 20"><path fill="currentColor" d="M2.93 17.07A10 10 0 1 1 17.07 2.93A10 10 0 0 1 2.93 17.07M9 5v6h2V5zm0 8v2h2v-2z"/></svg>
                Solo letras minúsculas y sin acentos </p>
            <div class="container-boton">
                <button class="btn-encriptar">
                    Encriptar
                </button>
                <button class="btn-desencriptar">
                    Desencriptar
                </button>

            </div>
        </div>
        <div class="container-texto">
            <img src="assets/Muneco.svg" alt="">
            <h2>Ningun mensaje fue encontrado</h2>
            <p>Ingresa el texto que desees encriptar o desencriptar.</p>

            <div class="container-copiar">
                <textarea name="" id="" readonly></textarea>
                <button class="btn-copiar">
                    Copiar
                </button>
            </div>
        </div>
       
    </section>
 
  </main>
  <script src="/src//scripts/Encriptador.js"></script>
</body>

</html>
